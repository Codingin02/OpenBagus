[package]
name = "openbagus_quant_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "openbagus_quant_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
