[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbagus"
dynamic = ["version"]
description = "CLI-first quantitative research and market-intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ahmad Bagus Idkholus Surur"}]
dependencies = []

[project.optional-dependencies]
storage = ["duckdb>=0.9.0"]

[project.scripts]
openbagus = "openbagus.cli:main"

[tool.setuptools.dynamic]
version = {attr = "openbagus.__version__"}

[tool.setuptools.packages.find]
include = ["openbagus*", "openbagus_finance*"]
